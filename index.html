<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JWA</title>
    <link rel="stylesheet" href="./index.css">
</head>
<body>
    <div id="root" data-js-root>
        <form action="./register" method="post" novalidate data-js-form>
            <div class="d-flex">
                <label for="login">Логин</label>
                <input 
                    type="text" 
                    name="login" 
                    id="login" 
                    required
                    aria-errormessage="login-errors"
                    minlength="6"
                    maxlength="18"
                >

                <span class="field__errors" id="login-errors" data-js-form-field-errors></span>
            </div>

            <div class="d-flex">
                <label for="password">Пароль</label>
                <input 
                    type="password" 
                    name="password" 
                    id="password" 
                    required
                    aria-errormessage="password-errors"
                    minlength="8"
                    maxlength="16"
                    pattern="(?=.*\d)(?=.*[a-z])(?=.*[A-Z]).{8,16}"
                    title="Пароль должен быть длиной от 8 до 16 символов, включать как минимум одну цифру, одну букву в нижнем и одну букву в верхнем регистре"
                >
                
                <span class="field__errors" id="password-errors" data-js-form-field-errors></span>                
            </div>

            <div class="d-flex">
                <label for="about">О себе</label>
                <textarea name="about" id="about"></textarea>
            </div>

            <fieldset class="radios">
                <legend class="radios__legend">
                    Ваш пол
                </legend>

                <input 
                    class="radio__control" 
                    type="radio" 
                    name="gender" 
                    id="male"
                    value="Мужской"
                    required
                    aria-errormessage="gender-errors"
                >
                <label class="radio__label" for="male">Мужской</label>
                
                <input 
                    class="radio__control" 
                    type="radio" 
                    name="gender" 
                    id="female"
                    value="Женский"
                    required
                    aria-errormessage="gender-errors"
                >
                <label class="radio__label" for="female">Женский</label>

                <span class="field__errors" id="gender-errors" data-js-form-field-errors></span>
            </fieldset>

            <div class="field checkbox">
                <input 
                    class="checkbox__control"
                    type="checkbox"
                    name="agreement"
                    id="agreement"
                    required
                    aria-errormessage="agreement-errors"
                >
                <label class="field__label checkbox__label" for="agreement">Согласен на всё</label> <br>

                <span class="field__errors" id="agreement-errors" data-js-form-field-errors></span>
            </div>

            <input type="submit" name="submit" value="Зарегистрироваться">
        </form>
        <div class="todo">

        </div>
    </div>
    <script src="./scripts/main.js" type="module"></script>
</body>
</html>
