<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JWA</title>
    <link rel="stylesheet" href="./index.css">
    <script src="./scripts/main.js" type="module"></script>
</head>
<body>
    <div id="root" data-js-root>
        <div class="todo" data-js-todo>
            <h1 class="todo__title">To Do List</h1>
            <form class="todo__form" data-js-todo-new-task-form>
                <div class="todo__field field">
                    <label class="field__label" for="new-task">New task title</label>
                    <input 
                        type="text" 
                        class="field__input" 
                        name="new-task" 
                        id="new-task" 
                        placeholder=" "
                        autocomplete="off"
                        data-js-todo-new-task-input
                    >
                </div>
                <button type="submit" class="todo__field-button button">
                    Add
                </button>
            </form>
            <form class="todo__form" data-js-todo-search-task-form>
                <div class="todo__field field">
                    <label class="field__label" for="search-task">Search task</label>
                    <input 
                        type="search" 
                        class="field__input" 
                        name="search-task" 
                        id="search-task" 
                        placeholder=" "
                        data-js-todo-search-task-input
                    >
                </div>
            </form>
            <div class="todo__info">
                <div class="todo__total-task">
                    Total Tasks: <span data-js-todo-total-task>0</span>
                </div>
                <button 
                    class="todo__delete-all-button button" 
                    type="button"
                    data-js-todo-delete-all-button
                >
                    Delete All
                </button>
            </div>
            <ul class="todo__list" data-js-todo-list>
                <li class="todo__item todo-item" data-js-todo-item>
                    <input 
                        class="todo-item__checkbox" 
                        type="checkbox" 
                        name="checkbox"
                        id="todo-1"
                        data-js-todo-item-checkbox
                    >
                    <label 
                        class="todo-item__label" 
                        for="todo-1"
                        data-js-todo-item-label
                    >
                        Todo 1
                    </label>
                    <button 
                        class="todo-item__delete-button" 
                        type="button"
                        aria-label="Delete"
                        title="Delete"
                        data-js-todo-item-delete-button
                    >
                        <svg width="20" height="20" viewBox="0 0 20 20" fill="none" xmlns="http://www.w3.org/2000/svg">
                            <path d="M15 5L5 15M5 5L15 15" stroke="#757575" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
                        </svg>
                    </button>
                </li>   
                <li class="todo__item todo-item" data-js-todo-item>
                    <input 
                        class="todo-item__checkbox" 
                        type="checkbox" 
                        name="checkbox"
                        id="todo-1"
                        data-js-todo-item-checkbox
                    >
                    <label 
                        class="todo-item__label" 
                        for="todo-1"
                        data-js-todo-item-label
                    >
                        Todo 1
                    </label>
                    <button 
                        class="todo-item__delete-button" 
                        type="button"
                        aria-label="Delete"
                        title="Delete"
                        data-js-todo-item-delete-button
                    >
                        <svg width="20" height="20" viewBox="0 0 20 20" fill="none" xmlns="http://www.w3.org/2000/svg">
                            <path d="M15 5L5 15M5 5L15 15" stroke="#757575" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
                        </svg>
                    </button>
                </li>
            </ul>
            <div class="todo__empty-message" data-js-empty-message></div>
        </div>
        <form action="./register" class="form__for-user" method="post" novalidate data-js-form>
            <div class="d-flex">
                <label for="login">Логин</label>
                <input 
                    type="text" 
                    name="login" 
                    id="login" 
                    required
                    aria-errormessage="login-errors"
                    minlength="6"
                    maxlength="18"
                >

                <span class="field__errors" id="login-errors" data-js-form-field-errors></span>
            </div>

            <div class="d-flex">
                <label for="password">Пароль</label>
                <input 
                    type="password" 
                    name="password" 
                    id="password" 
                    required
                    aria-errormessage="password-errors"
                    minlength="8"
                    maxlength="16"
                    pattern="(?=.*\d)(?=.*[a-z])(?=.*[A-Z]).{8,16}"
                    title="Пароль должен быть длиной от 8 до 16 символов, включать как минимум одну цифру, одну букву в нижнем и одну букву в верхнем регистре"
                >
                
                <span class="field__errors" id="password-errors" data-js-form-field-errors></span>                
            </div>

            <div class="d-flex">
                <label for="about">О себе</label>
                <textarea name="about" id="about"></textarea>
            </div>

            <fieldset class="radios">
                <legend class="radios__legend">
                    Ваш пол
                </legend>

                <input 
                    class="radio__control" 
                    type="radio" 
                    name="gender" 
                    id="male"
                    value="Мужской"
                    required
                    aria-errormessage="gender-errors"
                >
                <label class="radio__label" for="male">Мужской</label>
                
                <input 
                    class="radio__control" 
                    type="radio" 
                    name="gender" 
                    id="female"
                    value="Женский"
                    required
                    aria-errormessage="gender-errors"
                >
                <label class="radio__label" for="female">Женский</label>

                <span class="field__errors" id="gender-errors" data-js-form-field-errors></span>
            </fieldset>

            <div class="field checkbox">
                <input 
                class="checkbox__control"
                type="checkbox"
                name="agreement"
                id="agreement"
                required
                aria-errormessage="agreement-errors"
                >
                <label class="field__label checkbox__label" for="agreement">Согласен на всё</label> <br>
                
                <span class="field__errors" id="agreement-errors" data-js-form-field-errors></span>
            </div>
            
            <input type="submit" name="submit" value="Зарегистрироваться">
        </form>
    </div>
</body>
</html>
