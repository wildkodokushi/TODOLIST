<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JWA</title>
    <link rel="stylesheet" href="./index.css">
    <script src="./scripts/main.js" type="module"></script>
</head>
<body>
    <div id="root" data-js-root>
        <div class="todo" data-js-todo>
            <h1 class="todo__title">To Do List</h1>
            <form class="todo__form" data-js-todo-new-task-form>
                <div class="todo__field field">
                    <label class="field__label" for="new-task">New task title</label>
                    <input 
                        type="text" 
                        class="field__input" 
                        name="new-task" 
                        id="new-task" 
                        placeholder=" "
                        autocomplete="off"
                        data-js-todo-new-task-input
                    >
                </div>
                <button type="submit" class="todo__field-button button">
                    Add
                </button>
            </form>
            <form class="todo__form" data-js-todo-search-task-form>
                <div class="todo__field field">
                    <label class="field__label" for="search-task">Search task</label>
                    <input 
                        type="search" 
                        class="field__input" 
                        name="search-task" 
                        id="search-task" 
                        placeholder=" "
                        data-js-todo-search-task-input
                    >
                </div>
            </form>
            <div class="todo__info">
                <div class="todo__total-task">
                    Total Tasks: <span data-js-todo-total-task>0</span>
                </div>
                <button 
                    class="todo__delete-all-button button" 
                    type="button"
                    data-js-todo-delete-all-button
                >
                    Delete All
                </button>
            </div>
            <ul class="todo__list" data-js-todo-list></ul>
            <div class="todo__empty-message" data-js-empty-message></div>
        </div>
        <form action="./register" class="form" method="post" novalidate data-js-form>
            <h1 class="form__title">Registration</h1>
            <div class="form__field">
                <label class="form__field-label" for="login">Логин</label>
                <input
                    class="form__field-input"
                    type="text" 
                    name="login" 
                    id="login" 
                    required
                    aria-errormessage="login-errors"
                    minlength="6"
                    maxlength="18"
                    autocomplete="off"
                    placeholder=" "
                >

                <span class="field__errors" id="login-errors" data-js-form-field-errors></span>
            </div>
            <div class="form__field">
                <label class="form__field-label" for="password">Пароль</label>
                <input 
                    class="form__field-input"
                    type="password" 
                    name="password" 
                    id="password" 
                    required
                    aria-errormessage="password-errors"
                    minlength="8"
                    maxlength="16"
                    autocomplete="off"
                    placeholder=" "
                    pattern="(?=.*\d)(?=.*[a-z])(?=.*[A-Z]).{8,16}"
                    title="Пароль должен быть длиной от 8 до 16 символов, включать как минимум одну цифру, одну букву в нижнем и одну букву в верхнем регистре"
                >
                
                <span class="field__errors" id="password-errors" data-js-form-field-errors></span>                
            </div>
            <div class="field__textarea">
                <label class="field__textarea-label" for="about">О себе</label>
                <textarea class="field__textarea-input" name="about" id="about" placeholder=" "></textarea>
            </div>
            <fieldset class="radios">
                <legend class="radios__legend">
                    Ваш пол
                </legend>

                <input 
                    class="radio__control" 
                    type="radio" 
                    name="gender" 
                    id="male"
                    value="Мужской"
                    required
                    aria-errormessage="gender-errors"
                >
                <label class="radio__label" for="male">Мужской</label>
                
                <input 
                    class="radio__control" 
                    type="radio" 
                    name="gender" 
                    id="female"
                    value="Женский"
                    required
                    aria-errormessage="gender-errors"
                >
                <label class="radio__label" for="female">Женский</label>

                <span class="field__errors" id="gender-errors" data-js-form-field-errors></span>
            </fieldset>
            <div class="field__checkbox checkbox">
                <input 
                    class="field__checkbox-input"
                    type="checkbox"
                    name="agreement"
                    id="agreement"
                    required
                    aria-errormessage="agreement-errors"
                >
                <label class="field__checkbox-label" for="agreement">Согласен на всё</label>

                <span class="field__errors" id="agreement-errors" data-js-form-field-errors></span>
            </div>
            
            <input class="button" type="submit" name="submit" value="Зарегистрироваться">
        </form>
    </div>
</body>
</html>
